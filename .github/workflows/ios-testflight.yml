name: iOS · Build & TestFlight

# Compila TolvaScan (app LiDAR) en los servidores macOS de GitHub y la sube a
# TestFlight. No requiere un Mac propio.
#
# Secretos requeridos (Settings → Secrets and variables → Actions → New secret):
#   APPLE_TEAM_ID    -> Team ID (10 caracteres) de tu cuenta Apple Developer.
#   ASC_KEY_ID       -> Key ID de la API Key de App Store Connect.
#   ASC_ISSUER_ID    -> Issuer ID de App Store Connect.
#   ASC_PRIVATE_KEY  -> Contenido completo del archivo .p8 (incluyendo
#                       -----BEGIN PRIVATE KEY----- ... -----END PRIVATE KEY-----).
# Variable opcional:
#   IOS_BUNDLE_ID    -> Bundle ID (por defecto cl.iconstruye.tolvascan).
#
# Cómo ejecutarlo: pestaña Actions → "iOS · Build & TestFlight" → Run workflow.
# (También se dispara al crear un tag que empiece con "testflight-".)

on:
  workflow_dispatch:
  push:
    tags:
      - "testflight-*"

jobs:
  build:
    runs-on: macos-14
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'cl.iconstruye.tolvascan' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode estable
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Preparar API Key de App Store Connect
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Generar proyecto Xcode
        working-directory: TolvaScan
        run: |
          xcodegen generate
          # Número de build incremental (App Store Connect exige que suba cada vez).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" TolvaScan/Generated-Info.plist

      - name: Archivar (Archive)
        working-directory: TolvaScan
        run: |
          xcodebuild \
            -project TolvaScan.xcodeproj \
            -scheme TolvaScan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/TolvaScan.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Exportar IPA
        working-directory: TolvaScan
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/TolvaScan.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Subir a TestFlight
        working-directory: TolvaScan
        run: |
          xcrun altool --upload-app \
            -f build/export/*.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Guardar IPA como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TolvaScan-ipa
          path: TolvaScan/build/export/*.ipa
          if-no-files-found: ignore
